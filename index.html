<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="unnati_hero.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
    rel="stylesheet">
  <title>Neha Enterprises | Premium Shopping</title>
</head>

<body>
  <div id="root">
    <!-- Preloader -->
    <style>
      #root:empty .preloader {
        display: flex;
      }

      .preloader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #ffffff;
        background-image: radial-gradient(circle at center, #ffffff 0%, #f8fafc 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        font-family: 'Outfit', sans-serif;
      }

      .brand-logo-container {
        width: 160px;
        height: 160px;
        border-radius: 50%;
        overflow: hidden;
        box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        margin-bottom: 32px;
        animation: pulseLogo 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        background: #fff;
        border: 4px solid #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .brand-logo-container img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      @keyframes pulseLogo {
        0%, 100% {
          transform: scale(1);
          box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }
        50% {
          transform: scale(1.05);
          box-shadow: 0 20px 50px rgba(39, 49, 138, 0.2);
        }
      }

      .skeleton-bar {
        width: 200px;
        height: 6px;
        background: #e2e8f0;
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }

      .skeleton-bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 40%;
        background: linear-gradient(90deg, transparent, #27318a, transparent);
        border-radius: 9999px;
        animation: shimmer 1.5s infinite ease-in-out;
      }

      @keyframes shimmer {
        0% { transform: translateX(-150%); }
        100% { transform: translateX(300%); }
      }
    </style>
    <div class="preloader">
      <div class="brand-logo-container">
        <img src="https://ik.imagekit.io/gokulgorakhpur/Gokul/newlogo.jpeg" alt="Loading...">
      </div>
      <div class="skeleton-bar"></div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
